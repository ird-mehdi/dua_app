name: dua
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  responsive_sizer: ^3.3.1
  get: ^4.6.6
  network_info_plus: ^6.1.0
  get_it: ^8.0.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  talker_logger: ^4.4.1
  equatable: ^2.0.5
  fpdart: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  share_plus: ^10.1.2
  logger: ^2.5.0
  drift_flutter: ^0.2.4
  shared_preferences: ^2.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:

  uses-material-design: true

  assets:
    - assets/images/svg/
    - assets/images/png/
    - assets/databases/database.sqlite
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

    - family: KFGQ
      fonts:
        - asset: assets/fonts/kfgq.otf
